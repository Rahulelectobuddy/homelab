services:
  # =========================
  # Immich
  # =========================
  immich-db:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    volumes:
      - /home/rahul/immich/pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  immich-redis:
    image: redis:6.2
    restart: unless-stopped

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    depends_on:
      - immich-db
      - immich-redis
    environment:
      DB_HOST: immich-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      REDIS_PORT: 6379
    volumes:
      - /home/rahul/immich/library:/data
    ports:
      - "2283:2283"
    restart: unless-stopped

  # =========================
  # Jellyfin
  # =========================
  jellyfin:
    image: jellyfin/jellyfin:latest
    environment:
      TZ: Asia/Kolkata
    volumes:
      - /home/rahul/jellyfin/media:/media
    ports:
      - "8096:8096"
      - "8920:8920"
    restart: unless-stopped

  # =========================
  # Paperless
  # =========================
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_TIME_ZONE: Asia/Kolkata
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_OCR_LANGUAGE: eng
    volumes:
      - /home/rahul/paperless/data:/usr/src/paperless/data
      - /home/rahul/paperless/media:/usr/src/paperless/media
      - /home/rahul/paperless/consume:/usr/src/paperless/consume
    ports:
      - "8000:8000"
    depends_on:
      - paperless-redis
    restart: unless-stopped

  paperless-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: always

  # =========================
  # Homepage
  # =========================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    volumes:
      - /home/rahul/homepage/config:/app/config
      - /home/rahul/homepage/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HOMEPAGE_DISABLE_HOST_VALIDATION: "true"
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
    ports:
      - "80:3000"
    restart: unless-stopped

  # =========================
  # Docmost
  # =========================
  docmost-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD}
    volumes:
      - /home/rahul/docmost/db:/var/lib/postgresql/data
    restart: always

  docmost-redis:
    image: redis:7-alpine
    restart: always

  docmost:
    image: docmost/docmost:latest
    depends_on:
      - docmost-db
      - docmost-redis
    environment:
      APP_URL: ${DOCMOST_APP_URL}
      APP_SECRET: ${DOCMOST_APP_SECRET}
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD}@docmost-db:5432/docmost?schema=public
      REDIS_URL: redis://docmost-redis:6379
    ports:
      - "3000:3000"
    volumes:
      - /home/rahul/docmost/storage:/app/storage
    restart: always

  # =========================
  # MeTube
  # =========================
  metube:
    image: ghcr.io/alexta69/metube:latest
    environment:
      UID: 1000
      GID: 1000
      TZ: Asia/Kolkata
    volumes:
      - /home/rahul/metube/downloads:/downloads
    ports:
      - "8081:8081"
    restart: unless-stopped

  # =========================
  # n8n
  # =========================
  n8n-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - /home/rahul/n8n/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      TZ: Asia/Kolkata
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_METRICS: "false"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - /home/rahul/n8n/data:/home/node/.n8n
      - /home/rahul/n8n/files:/files
    ports:
      - "5678:5678"
    restart: unless-stopped

  # =========================
  # IT Tools
  # =========================
  it-tools:
    image: corentinth/it-tools:latest
    ports:
      - "8085:80"
    restart: unless-stopped

  # =========================
  # Mealie
  # =========================
  mealie-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mealie
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
    volumes:
      - /home/rahul/mealie/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    depends_on:
      - mealie-postgres
    environment:
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
      POSTGRES_SERVER: mealie-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
      TZ: Asia/Kolkata
      BASE_URL: ${MEALIE_BASE_URL}
      ALLOW_SIGNUP: "false"
      MAX_WORKERS: "2"
      WEB_CONCURRENCY: "2"
    volumes:
      - /home/rahul/mealie/data:/app/data
    ports:
      - "9925:9000"
    restart: unless-stopped

  # =========================
  # qBittorrent
  # =========================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.2
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Kolkata
      WEBUI_PORT: 8080
    volumes:
      - /home/rahul/qbittorrent/config:/config
      - /home/rahul/qbittorrent/downloads:/downloads
      - /home/rahul/qbittorrent/watch:/watch
    ports:
      - "8091:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  # =========================
  # Vikunja
  # =========================
  vikunja-mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${VIKUNJA_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: vikunja
      MYSQL_USER: vikunja
      MYSQL_PASSWORD: ${VIKUNJA_DB_PASSWORD}
    volumes:
      - /home/rahul/vikunja/mariadb_data:/var/lib/mysql
    restart: unless-stopped

  vikunja:
    image: vikunja/vikunja:latest
    depends_on:
      - vikunja-mariadb
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL}
      VIKUNJA_DATABASE_TYPE: mysql
      VIKUNJA_DATABASE_HOST: vikunja-mariadb
      VIKUNJA_DATABASE_PORT: 3306
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
    volumes:
      - /home/rahul/vikunja/files:/app/vikunja/files
    ports:
      - "3456:3456"
    restart: unless-stopped

  # =========================
  # Nextcloud AIO
  #
  # AIO intentionally remains a master container. It manages
  # Nextcloud's own child containers and storage.
  # =========================
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      APACHE_PORT: "11000"
      APACHE_IP_BINDING: "127.0.0.1"
      SKIP_DOMAIN_VALIDATION: "true"
    ports:
      - "8080:8080"

  # =========================
  # Zulip
  # =========================
  zulip-db:
    image: zulip/zulip-postgresql:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: ${ZULIP_POSTGRES_PASSWORD}
    volumes:
      - zulip_postgresql:/var/lib/postgresql/data
    networks:
      - zulip

  zulip-memcached:
    image: memcached:alpine
    restart: unless-stopped
    command:
      - sh
      - -euc
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$MEMCACHED_PASSWORD" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$MEMCACHED_PASSWORD" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: /home/memcache/memcached.conf
      MEMCACHED_SASL_PWDB: /home/memcache/memcached-sasl-db
      MEMCACHED_PASSWORD: ${ZULIP_MEMCACHED_PASSWORD}
    networks:
      - zulip

  zulip-rabbitmq:
    image: rabbitmq:4.2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: ${ZULIP_RABBITMQ_PASSWORD}
    volumes:
      - zulip_rabbitmq:/var/lib/rabbitmq
    networks:
      - zulip

  zulip-redis:
    image: redis:alpine
    restart: unless-stopped
    command:
      - sh
      - -euc
      - |
        echo "requirepass '$$REDIS_PASSWORD'" > /etc/redis.conf
        exec redis-server /etc/redis.conf
    environment:
      REDIS_PASSWORD: ${ZULIP_REDIS_PASSWORD}
    volumes:
      - zulip_redis:/data
    networks:
      - zulip

  zulip:
    image: ghcr.io/zulip/zulip-server:12.1-0
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      SETTING_EXTERNAL_HOST: ${ZULIP_EXTERNAL_HOST}
      SETTING_ZULIP_ADMINISTRATOR: ${ZULIP_ADMINISTRATOR}
      SETTING_REMOTE_POSTGRES_HOST: zulip-db
      SETTING_MEMCACHED_LOCATION: zulip-memcached:11211
      SETTING_RABBITMQ_HOST: zulip-rabbitmq
      SETTING_REDIS_HOST: zulip-redis
      SECRETS_postgres_password: ${ZULIP_POSTGRES_PASSWORD}
      SECRETS_memcached_password: ${ZULIP_MEMCACHED_PASSWORD}
      SECRETS_rabbitmq_password: ${ZULIP_RABBITMQ_PASSWORD}
      SECRETS_redis_password: ${ZULIP_REDIS_PASSWORD}
      SECRETS_secret_key: ${ZULIP_SECRET_KEY}
      ZULIP_AUTH_BACKENDS: EmailAuthBackend
      TRUST_GATEWAY_IP: "True"
    volumes:
      - zulip_data:/data
    depends_on:
      - zulip-db
      - zulip-memcached
      - zulip-rabbitmq
      - zulip-redis
    networks:
      - zulip
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576

networks:
  zulip:
    driver: bridge

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
  zulip_data:
  zulip_postgresql:
  zulip_rabbitmq:
  zulip_redis:
