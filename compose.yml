# Zulip credentials are stored inline by request. Keep this file private.
# Preserve these values when redeploying or restoring an existing installation.
x-zulip-credentials:
  postgres: &zulip_postgres "f886544b1965203cabc30929f84b37c416656f89abef6bf1968994287eb0a746"
  memcached: &zulip_memcached "499aa4165bd4fad329d21c169371732570f48310deff3a9634301b752d52d4bd"
  rabbitmq: &zulip_rabbitmq "31c6296b42b227ada2b3f148406a4c277976a50671515668e30287baabeecb0b"
  redis: &zulip_redis "6c52df54190dc02656bfa7540171bb9e1f795bada80d899c64934a20d88ea302"
  secret_key: &zulip_secret_key "70b723109b21a09fbef3e8e4cf257aaed9955ec5fc8a6a29d7e4eb6fe8b49028"

services:
  # =========================
  # n8n
  # =========================
  n8n-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n_db_secret_change_me}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U n8n -d n8n" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_db_secret_change_me}
      TZ: Asia/Kolkata
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-n8n_encryption_key_change_me_32_chars}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_METRICS: "false"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    restart: unless-stopped

  # =========================
  # Vikunja
  # =========================
  vikunja-mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${VIKUNJA_DB_ROOT_PASSWORD:-vikunja_root_secret_change_me}
      MYSQL_ROOT_PASSWORD: ${VIKUNJA_DB_ROOT_PASSWORD:-vikunja_root_secret_change_me}
      MARIADB_DATABASE: vikunja
      MYSQL_DATABASE: vikunja
      MARIADB_USER: vikunja
      MYSQL_USER: vikunja
      MARIADB_PASSWORD: ${VIKUNJA_DB_PASSWORD:-vikunja_db_secret_change_me}
      MYSQL_PASSWORD: ${VIKUNJA_DB_PASSWORD:-vikunja_db_secret_change_me}
    volumes:
      - vikunja_db_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD-SHELL", "healthcheck.sh --connect --innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  vikunja:
    image: vikunja/vikunja:latest
    user: "0:0"
    depends_on:
      vikunja-mariadb:
        condition: service_healthy
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL:-http://192.168.1.46:3456/}
      VIKUNJA_DATABASE_TYPE: mysql
      VIKUNJA_DATABASE_HOST: vikunja-mariadb
      VIKUNJA_DATABASE_PORT: 3306
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD:-vikunja_db_secret_change_me}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_JWT_SECRET:-vikunja_jwt_secret_change_me_long_random}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET:-vikunja_jwt_secret_change_me_long_random}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
    volumes:
      - vikunja_files:/app/vikunja/files

    ports:
      - "3456:3456"
    restart: unless-stopped

  # =========================
  # Nextcloud AIO
  # =========================
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      APACHE_PORT: "11000"
      APACHE_IP_BINDING: "0.0.0.0"
      SKIP_DOMAIN_VALIDATION: "true"
    ports:
      - "8080:8080"

  # =========================
  # Vaultwarden (Password Manager)
  # =========================
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-}
    volumes:
      - vaultwarden_data:/data
    ports:
      - "${VAULTWARDEN_PORT:-8088}:80"
    restart: unless-stopped

  # Zulip starts with the rest of the stack; no .env is needed for Zulip.
  # Based on https://github.com/zulip/docker-zulip/blob/main/compose.yaml
  zulip-postgres:
    image: zulip/zulip-postgresql:14
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: *zulip_postgres
    volumes:
      - zulip_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  zulip-memcached:
    image: memcached:alpine
    command:
      - sh
      - -euc
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$MEMCACHED_PASSWORD" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$MEMCACHED_PASSWORD" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    environment:
      SASL_CONF_PATH: /home/memcache/memcached.conf
      MEMCACHED_SASL_PWDB: /home/memcache/memcached-sasl-db
      MEMCACHED_PASSWORD: *zulip_memcached
    restart: unless-stopped

  zulip-rabbitmq:
    image: rabbitmq:4.2
    command:
      - sh
      - -euc
      - |
        echo 'default_user = $$(RABBITMQ_DEFAULT_USER)' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $$(RABBITMQ_DEFAULT_PASS)' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: *zulip_rabbitmq
    volumes:
      - zulip_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  zulip-redis:
    image: redis:alpine
    command:
      - sh
      - -euc
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: *zulip_redis
    volumes:
      - zulip_redis_data:/data
    restart: unless-stopped

  zulip:
    image: ghcr.io/zulip/zulip-server:12.3-0
    depends_on:
      - zulip-postgres
      - zulip-memcached
      - zulip-rabbitmq
      - zulip-redis
    environment:
      SETTING_EXTERNAL_HOST: talk.cypherlifeos.space
      SETTING_ZULIP_ADMINISTRATOR: rahulyugalgarg@gmail.com
      SETTING_REMOTE_POSTGRES_HOST: zulip-postgres
      SETTING_MEMCACHED_LOCATION: zulip-memcached:11211
      SETTING_RABBITMQ_HOST: zulip-rabbitmq
      SETTING_REDIS_HOST: zulip-redis
      # Host-based Cloudflare Tunnel terminates public HTTPS.
      TRUST_GATEWAY_IP: "true"
      # No SMTP: retrieve account emails manually from inside the container.
      SETTING_EMAIL_BACKEND: django.core.mail.backends.filebased.EmailBackend
      SETTING_EMAIL_FILE_PATH: /var/log/zulip/emails
      SECRETS_postgres_password: *zulip_postgres
      SECRETS_memcached_password: *zulip_memcached
      SECRETS_rabbitmq_password: *zulip_rabbitmq
      SECRETS_redis_password: *zulip_redis
      SECRETS_secret_key: *zulip_secret_key
    volumes:
      - zulip_data:/data
    ports:
      - "127.0.0.1:8090:80"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    restart: unless-stopped

volumes:
  n8n_db_data:
  n8n_data:
  vikunja_db_data:
  vikunja_files:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
  vaultwarden_data:
  zulip_data:
  zulip_db_data:
  zulip_rabbitmq_data:
  zulip_redis_data:




