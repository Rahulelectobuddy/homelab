services:
  # =========================
  # PostgreSQL (Shared Database)
  # =========================
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret_change_me}
      POSTGRES_DB: postgres
      VIKUNJA_DB_PASSWORD: ${VIKUNJA_DB_PASSWORD:-vikunja_db_secret_change_me}
      PAPERLESS_DB_PASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless_db_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # =========================
  # Vikunja
  # =========================
  vikunja:
    image: vikunja/vikunja:latest
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${VIKUNJA_PUBLIC_URL:-http://192.168.1.46:3456/}
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_PORT: 5432
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: ${VIKUNJA_DB_PASSWORD:-vikunja_db_secret_change_me}
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_JWT_SECRET:-vikunja_jwt_secret_change_me_long_random}
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET:-vikunja_jwt_secret_change_me_long_random}
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
    volumes:
      - vikunja_files:/app/vikunja/files
    ports:
      - "3456:3456"
    restart: unless-stopped

  # =========================
  # Nextcloud AIO
  # =========================
  nextcloud-aio-mastercontainer:
    image: nextcloud/all-in-one:latest
    container_name: nextcloud-aio-mastercontainer
    init: true
    restart: always
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      APACHE_PORT: "11000"
      APACHE_IP_BINDING: "0.0.0.0"
      SKIP_DOMAIN_VALIDATION: "true"
    ports:
      - "8080:8080"

  # =========================
  # Vaultwarden (Password Manager)
  # =========================
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      WEBSOCKET_ENABLED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-}
    volumes:
      - vaultwarden_data:/data
    ports:
      - "${VAULTWARDEN_PORT:-8088}:80"
    restart: unless-stopped

  # =========================
  # SFTPGo (Obsidian WebDAV storage)
  # =========================
  sftpgo:
    image: drakkan/sftpgo:v2.7.6
    environment:
      TZ: Asia/Kolkata
      SFTPGO_DATA_PROVIDER__DRIVER: sqlite
      SFTPGO_DATA_PROVIDER__NAME: /var/lib/sftpgo/sftpgo.db
      SFTPGO_DATA_PROVIDER__USERS_BASE_DIR: /srv/sftpgo/data
      SFTPGO_WEBDAVD__BINDINGS__0__PORT: "10080"
      SFTPGO_WEBDAVD__BINDINGS__0__ADDRESS: "0.0.0.0"
      SFTPGO_WEBDAVD__CORS__ENABLED: "true"
      SFTPGO_WEBDAVD__CORS__ALLOWED_ORIGINS: "app://obsidian,capacitor://localhost,http://localhost"
      SFTPGO_WEBDAVD__CORS__ALLOWED_METHODS: "OPTIONS,GET,HEAD,POST,PUT,DELETE,MKCOL,PROPFIND,PROPPATCH,MOVE,COPY,LOCK,UNLOCK"
      SFTPGO_WEBDAVD__CORS__ALLOWED_HEADERS: "*"
      SFTPGO_WEBDAVD__CORS__EXPOSED_HEADERS: "DAV,Content-Length,Content-Type,ETag,Last-Modified,Location"
      SFTPGO_WEBDAVD__CORS__ALLOW_CREDENTIALS: "true"
    volumes:
      # Vault files and application backups.
      - sftpgo_data:/srv/sftpgo
      # SQLite user/admin database, configuration, and SSH host keys.
      - sftpgo_config:/var/lib/sftpgo
    ports:
      - "127.0.0.1:8089:8080"
      - "0.0.0.0:10080:10080"
      - "0.0.0.0:2022:2022"
    restart: unless-stopped

  # =========================
  # Paperless-ngx (Document Management)
  # =========================
  paperless-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - paperless_redis_data:/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      paperless-redis:
        condition: service_started
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless_db_secret_change_me}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-paperless_secret_key_change_me_32_chars}
      PAPERLESS_TIME_ZONE: Asia/Kolkata
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8000}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"

volumes:
  postgres_data:
  vikunja_files:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer
  vaultwarden_data:
  sftpgo_data:
  sftpgo_config:
  paperless_data:
  paperless_media:
  paperless_redis_data:
